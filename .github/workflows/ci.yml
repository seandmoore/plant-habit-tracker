name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Expo and proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ReactMockup/package-lock.json
            Proxy/package-lock.json

      - name: Install Expo dependencies
        working-directory: ReactMockup
        run: npm ci --ignore-scripts

      - name: Audit Expo dependencies
        working-directory: ReactMockup
        run: npm audit --audit-level=critical

      - name: Typecheck Expo preview
        working-directory: ReactMockup
        run: npm run typecheck

      - name: Test Expo preview
        working-directory: ReactMockup
        run: npm test -- --runInBand

      - name: Install Worker dependencies
        working-directory: Proxy
        run: npm ci --ignore-scripts

      - name: Audit Worker dependencies
        working-directory: Proxy
        run: npm audit --audit-level=high

      - name: Test Worker proxy
        working-directory: Proxy
        run: npm test

  native:
    name: SwiftUI app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test native app
        run: >-
          xcodebuild test
          -project PlantCompanion.xcodeproj
          -scheme PlantCompanion
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
