name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Contract and proxy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Proxy/package-lock.json

      - name: Verify generated files match the contract
        run: |
          node Scripts/sync-swift-catalog.mjs
          node Proxy/scripts/sync-catalog.mjs
          git diff --exit-code -- \
            PlantCompanion/Core/Services/StarterCatalog.swift \
            Proxy/src/catalog.mjs

      - name: Install Worker dependencies
        working-directory: Proxy
        run: npm ci --ignore-scripts

      - name: Audit Worker dependencies
        working-directory: Proxy
        run: npm audit --audit-level=high

      - name: Test Worker proxy
        working-directory: Proxy
        run: npm test

  native:
    name: SwiftUI app
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test native app
        run: >-
          xcodebuild test
          -project PlantCompanion.xcodeproj
          -scheme PlantCompanion
          -destination 'platform=macOS'
          -resultBundlePath NativeTests.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Report native test failures
        if: failure()
        run: xcrun xcresulttool get test-results summary --path NativeTests.xcresult

      - name: Build iPhone and iPad app
        run: >-
          xcodebuild build
          -project PlantCompanion.xcodeproj
          -scheme PlantCompanion
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
