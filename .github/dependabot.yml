version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ReactMockup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo-preview:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Coordinate these breaking upgrades with the matching Expo SDK release.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@testing-library/react-native"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: jest
        update-types:
          - "version-update:semver-major"
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: /Proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker-proxy:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
