version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /Proxy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      worker-proxy:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
